syntax = "proto3";

package stream_executor;

message MetalComputeCapabilityProto {
  // The N in MTLGPUFamilyApple<N>. M1 = 7, M2 = 8, M3 = 9, M4 = 10, etc.
  // 0 indicates unknown / not yet populated.
  int32 family_generation = 1;

  // Whether [device supportsFamily:MTLGPUFamilyMetal3] returns true.
  // Metal 3 fast paths (richer simdgroup_matrix, mesh shaders, function
  // pointers, dynamic libraries) are gated on this.
  bool metal_3_supported = 2;
}
